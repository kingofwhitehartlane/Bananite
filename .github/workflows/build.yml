name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history/tags to compute the patch number

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Read major.minor from version.properties
        id: base
        run: |
          MM=$(grep -E '^majorMinor=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$MM" ]; then echo "majorMinor missing from version.properties" >&2; exit 1; fi
          echo "major_minor=$MM" >> "$GITHUB_OUTPUT"
          echo "Found major_minor: $MM"

      - name: Compute next patch number
        id: patch
        run: |
          MM="${{ steps.base.outputs.major_minor }}"
          git fetch --tags --force
          
          # Escape dots in MM for regex (e.g., "1.2" becomes "1\.2" so it doesn't match "1x2")
          MM_ESCAPED=$(echo "$MM" | sed 's/\./\\./g')
          
          echo "Debug: All tags in repo:"
          git tag --list
          
          # Find tags matching v1.2.x OR 1.2.x strictly
          MATCHING_TAGS=$(git tag --list | grep -E "^v?${MM_ESCAPED}\.[0-9]+$" || true)
          echo "Debug: Matching tags for this version: $MATCHING_TAGS"
          
          if [ -z "$MATCHING_TAGS" ]; then
            LAST=""
          else
            # Strip the "v1.2." or "1.2." prefix, sort numerically, and get the highest
            LAST=$(echo "$MATCHING_TAGS" | sed -E 's/^v?'"${MM_ESCAPED}"'\.//' | sort -n | tail -1)
          fi
          
          if [ -z "$LAST" ]; then 
            NEXT=0
          else 
            NEXT=$((LAST + 1))
          fi
          
          echo "patch=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Computed next patch: $NEXT (based on last detected: ${LAST:-none})"

      - name: Compose version
        id: ver
        run: |
          MM="${{ steps.base.outputs.major_minor }}"
          P="${{ steps.patch.outputs.patch }}"
          NAME="${MM}.${P}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Final version name: $NAME, tag: v${NAME}"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            --no-daemon

      - name: Rename APK to include version
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="Bananite-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "APK renamed to: $DEST"

      - name: Build release notes
        run: |
          MM="${{ steps.base.outputs.major_minor }}"
          FILE="release-notes/${MM}.md"
          if [ -f "$FILE" ]; then cp "$FILE" body.md; else echo "No release notes for ${MM}." > body.md; fi
          {
            echo ""
            echo "---"
            echo "_Build ${{ steps.ver.outputs.name }} · commit ${{ github.sha }}_"
          } >> body.md

      - name: Create git tag & GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Bananite ${{ steps.ver.outputs.name }}
          body_path: body.md
          files: ${{ steps.apk.outputs.path }}
          make_latest: true