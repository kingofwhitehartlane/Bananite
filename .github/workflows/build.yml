name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      # 1. FAIL FAST: Validate secrets before doing any work
      - name: Validate signing secrets
        run: |
          missing=()
          [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]] && missing+=("KEYSTORE_BASE64")
          [[ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]] && missing+=("KEYSTORE_PASSWORD")
          [[ -z "${{ secrets.KEY_ALIAS }}" ]] && missing+=("KEY_ALIAS")
          [[ -z "${{ secrets.KEY_PASSWORD }}" ]] && missing+=("KEY_PASSWORD")
          
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required signing secrets: ${missing[*]}. Aborting."
            exit 1
          fi

      # 2. FAST CHECKOUT: fetch-depth 1 + fetch-tags is much faster than depth 0
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      # 3. MERGED: Compute version in a single step
      - name: Compute version
        id: ver
        run: |
          MM=$(grep -E '^majorMinor=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$MM" ]; then echo "::error::majorMinor missing from version.properties"; exit 1; fi
          
          LAST=$(git tag --list "v${MM}.*" | sed -E "s/^v${MM}\.//" | sort -n | tail -1)
          if [ -z "$LAST" ]; then NEXT=0; else NEXT=$((LAST + 1)); fi
          
          NAME="${MM}.${NEXT}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MM" >> "$GITHUB_OUTPUT"

      # 4. NO 'if' CONDITION: Secrets are validated, so this will always succeed
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      # 5. MERGED: chmod + gradlew build in one step
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            --no-daemon

      # 6. MERGED: Rename APK and build release notes in one step
      - name: Prepare release artifacts
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="Bananite-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          
          MM="${{ steps.ver.outputs.major_minor }}"
          FILE="release-notes/${MM}.md"
          if [ -f "$FILE" ]; then cp "$FILE" body.md; else echo "No release notes for ${MM}." > body.md; fi
          {
            echo ""
            echo "---"
            echo "_Build ${{ steps.ver.outputs.name }} · commit ${{ github.sha }}_"
          } >> body.md

      - name: Create git tag & GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Bananite ${{ steps.ver.outputs.name }}
          body_path: body.md
          files: ${{ steps.apk.outputs.path }}
          make_latest: true